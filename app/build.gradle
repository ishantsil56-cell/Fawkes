plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ishantsil.fawkes'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ishantsil.fawkes'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.4.0'

        // The F17 is arm64. Both speech runtimes (Vosk, sherpa-onnx) ship
        // several ABIs; keeping only arm64-v8a keeps the APK small.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // Offline speech-to-text. The @aar matters: without it the native libs are missing.
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'

    // Whisper speech-to-text (sherpa-onnx). k2-fsa publishes no Maven
    // artifact, so CI fetches the release AAR into app/libs/ before the
    // build (see .github/workflows/build-apk.yml); it is gitignored.
    // Local builds need the same file — see README.
    implementation files("libs/sherpa-onnx-static-link-onnxruntime-1.13.3.aar")

    // On-device AI answers (MediaPipe LLM Inference, Gemma). The model file
    // itself (~2 GB) is imported by the user in Settings, not bundled.
    implementation 'com.google.mediapipe:tasks-genai:0.10.14'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
